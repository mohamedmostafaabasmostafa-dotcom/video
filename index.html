<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- مهم: عدم استخدام noreferrer لأنه يمنع الـ Referer وقد يسبب 153 -->
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <title>YouTube Embed Fix 153</title>

  <style>
    body{margin:0;padding:24px;background:#0b0f17;color:#e8eefc;font-family:Arial}
    .wrap{max-width:900px;margin:0 auto}
    .box{background:#121a2a;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px}
    .video{width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}
    iframe{width:100%;height:100%;border:0}
    .note{opacity:.8;margin-top:12px;line-height:1.6;font-size:13px}
    code{background:#0f1626;padding:2px 6px;border-radius:6px}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="box">
      <div class="video">
        <iframe
          src="https://www.youtube-nocookie.com/embed/g0Cst6bEyWs?rel=0&modestbranding=1&playsinline=1"
          title="YouTube video player"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
      </div>

      <div class="note">
        إذا استمر <b>Error 153</b> فالمشكلة غالبًا ليست في الكود بل في البيئة:
        تشغيل عبر <code>file://</code>، أو سياسة Referrer تمنع الـ Referer، أو إضافة Anti-tracker، أو Cloudflare/حماية تمنع طلبات iframe.
      </div>
    </div>
  </div>
</body>
</html>
